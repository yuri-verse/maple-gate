# 유저 랭킹 주기 수집 -> data/ranking.json 커밋
#
# 기본적으로 아무것도 안 한다. tools/ranking-sources.json 의 enabled 가 전부 false 면
# 수집기가 그냥 빠져나온다. 상대 사이트 동의를 받은 뒤에 켜라.
name: collect-ranking
on:
  schedule:
    - cron: '17 */3 * * *'      # 3시간마다 (공지·랭킹)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 랭킹 수집
        run: python3 tools/collect-ranking.py
      - name: 공지·이벤트 수집
        run: python3 tools/collect-notices.py
      - name: Supabase 업서트 (전투력 랭킹)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 tools/push-supabase.py
      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet -- data/ranking.json data/notices.json; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "collect-bot"
          git config user.email "noreply@github.com"
          git add data/ranking.json data/notices.json
          git commit -m "chore: 랭킹·공지 갱신 $(date -u +%FT%TZ)"
          git push
